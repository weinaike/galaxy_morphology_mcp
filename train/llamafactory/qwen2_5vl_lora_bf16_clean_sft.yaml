### Qwen2.5-VL-7B clean SFT with an unquantized BF16 base and LoRA.

### model
model_name_or_path: /media/zhongling/huggingface/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
image_max_pixels: 262144
image_min_pixels: 16384

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_target: all
freeze_vision_tower: true

### dataset
dataset_dir: /media/zhongling/wyh/GalDecomp_Gen/train/llamafactory/data_a6000_clean_lora_v1
dataset: galaxy_sft_train
eval_dataset: galaxy_sft_val
template: qwen2_vl
cutoff_len: 12288
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /media/zhongling/wyh/LLaMA-Factory/saves/qwen2_5vl-7b-galaxy-clean-bf16-lora-v1
logging_steps: 5
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 100
