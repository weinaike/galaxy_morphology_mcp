### Qwen3-VL-8B main-line full SFT on the locked clean Galaxy dataset.

### model
model_name_or_path: /mnt/si00237244jv/default/models/Qwen3-VL-8B-Instruct
trust_remote_code: true
image_max_pixels: 262144
image_min_pixels: 16384
video_max_pixels: 16384

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: false
freeze_language_model: false
deepspeed: examples/deepspeed/ds_z3_offload_config.json

### dataset
dataset_dir: /mnt/si00237244jv/default/GalDecomp_Gen/train/llamafactory/data_a100_clean_v1
dataset: galaxy_sft_train
eval_dataset: galaxy_sft_val
template: qwen3_vl_nothink
cutoff_len: 12288
max_samples: 1000000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: /mnt/si00237244jv/default/models/qwen3_vl-8b-galaxy-full-sft-v1
logging_steps: 5
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
